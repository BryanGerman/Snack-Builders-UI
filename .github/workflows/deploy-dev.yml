name: Deploy React UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ui/**"
      - ".github/workflows/deploy-ui.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: react-ui-pages
  cancel-in-progress: true

env:
  UI_DIR: ui

jobs:
  build:
    name: Build React UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "${{ env.UI_DIR }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ env.UI_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.UI_DIR }}
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_DEMO_JWT_SECRET: ${{ vars.VITE_DEMO_JWT_SECRET }}
          VITE_GITHUB_PAGES_BASE_PATH: /Snack-Builders/
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.UI_DIR }}/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4